name: Terraform Plan → Approve → Apply

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: terraform plan (parallel for each workspace)
  # ──────────────────────────────────────────────────────────────
  terraform-plan:
    name: Plan (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - terraform_cloud
          - test-workspace-01

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Override workspace in terraform.tf
        run: |
          sed -i 's/name = ".*"/name = "${{ matrix.workspace }}"/' terraform.tf

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan --var-file tfvars/${{ matrix.workspace }}.tfvars -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Save step outcomes
        run: |
          echo "fmt=${{ steps.fmt.outcome }}"           > outcomes.txt
          echo "validate=${{ steps.validate.outcome }}" >> outcomes.txt
          echo "plan=${{ steps.plan.outcome }}"         >> outcomes.txt

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.workspace }}
          path: |
            plan_output.txt
            outcomes.txt

  # ──────────────────────────────────────────────────────────────
  # Job 2: Post combined plan output as a PR comment
  # ──────────────────────────────────────────────────────────────
  post-comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Download plan for terraform_cloud
        uses: actions/download-artifact@v4
        with:
          name: plan-terraform_cloud
          path: plans/terraform_cloud
        continue-on-error: true

      - name: Download plan for test-workspace-01
        uses: actions/download-artifact@v4
        with:
          name: plan-test-workspace-01
          path: plans/test-workspace-01
        continue-on-error: true

      - name: Post combined comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const workspaces = ['terraform_cloud', 'test-workspace-01'];

            function readFile(p) {
              try { return fs.readFileSync(p, 'utf8'); } catch { return null; }
            }

            function parseOutcomes(content) {
              const r = { fmt: 'unknown', validate: 'unknown', plan: 'unknown' };
              if (!content) return r;
              for (const line of content.trim().split('\n')) {
                const [k, v] = line.split('=');
                if (k && v) r[k.trim()] = v.trim();
              }
              return r;
            }

            const maxLen = 25000;
            const icon = (o) => o === 'success' ? '✅' : o === 'failure' ? '❌' : '⚠️';

            let body = `## 🏗️ Terraform Plan Results\n`;
            body += `> Commit: \`${{ github.event.pull_request.head.sha }}\` | By @${{ github.actor }}\n\n`;
            body += `> ⏳ **Waiting for approval before apply.** A reviewer must approve the \`terraform-approve\` environment to proceed.\n\n`;

            for (const ws of workspaces) {
              const planRaw  = readFile(`plans/${ws}/plan_output.txt`);
              const outcomes = parseOutcomes(readFile(`plans/${ws}/outcomes.txt`));
              const plan     = planRaw
                ? (planRaw.length > maxLen ? '...(truncated)\n' + planRaw.slice(-maxLen) : planRaw)
                : '_Plan output not available_';

              body += `---\n### 🗂️ Workspace: \`${ws}\`\n\n`;
              body += `| Step         | Result |\n|--------------|--------|\n`;
              body += `| Format (fmt) | ${icon(outcomes.fmt)} \`${outcomes.fmt}\` |\n`;
              body += `| Validate     | ${icon(outcomes.validate)} \`${outcomes.validate}\` |\n`;
              body += `| Plan         | ${icon(outcomes.plan)} \`${outcomes.plan}\` |\n\n`;
              body += `<details>\n<summary>📋 Show Plan Output — ${ws}</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\n`;
            }

            body += `---\n> ⚠️ Review all plans before approving.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🏗️ Terraform Plan Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ──────────────────────────────────────────────────────────────
  # Job 3: Manual approval gate (uses GitHub Environment)
  # Reviewers configured on the "terraform-approve" Environment
  # will get a notification and must click Approve to proceed.
  # ──────────────────────────────────────────────────────────────
  wait-for-approval:
    name: ⏸️ Waiting for Approval
    runs-on: ubuntu-latest
    needs: post-comment
    if: needs.terraform-plan.result != 'failure' && github.event_name == 'pull_request'
    environment: terraform-approve   # ← set required reviewers on this in GitHub Settings
    steps:
      - name: Approved
        run: echo "✅ Approved by a reviewer. Proceeding with terraform apply..."

  # ──────────────────────────────────────────────────────────────
  # Job 4: terraform apply (parallel for each workspace, after approval)
  # ──────────────────────────────────────────────────────────────
  terraform-apply:
    name: Apply (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    needs: wait-for-approval
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - terraform_cloud
          - test-workspace-01

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Override workspace in terraform.tf
        run: |
          sed -i 's/name = ".*"/name = "${{ matrix.workspace }}"/' terraform.tf

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply --var-file tfvars/${{ matrix.workspace }}.tfvars -auto-approve -no-color 2>&1 | tee apply_output.txt

      - name: Upload apply output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-${{ matrix.workspace }}
          path: apply_output.txt
