name: Terraform Plan on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Run terraform plan for each workspace in parallel
  # ──────────────────────────────────────────────────────────────
  terraform-plan:
    name: Plan (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # let both workspaces finish even if one fails
      matrix:
        workspace:
          - terraform_cloud
          - test-workspace-01

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Override workspace in terraform.tf
        run: |
          sed -i 's/name = ".*"/name = "${{ matrix.workspace }}"/' terraform.tf
          echo "=== terraform.tf after override ==="
          cat terraform.tf

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Save step outcomes
        run: |
          echo "fmt=${{ steps.fmt.outcome }}"        > outcomes.txt
          echo "validate=${{ steps.validate.outcome }}" >> outcomes.txt
          echo "plan=${{ steps.plan.outcome }}"      >> outcomes.txt

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.workspace }}
          path: |
            plan_output.txt
            outcomes.txt

  # ──────────────────────────────────────────────────────────────
  # Job 2: Download both plan outputs and post a combined PR comment
  # ──────────────────────────────────────────────────────────────
  post-comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Download plan for terraform_cloud
        uses: actions/download-artifact@v4
        with:
          name: plan-terraform_cloud
          path: plans/terraform_cloud
        continue-on-error: true

      - name: Download plan for test-workspace-01
        uses: actions/download-artifact@v4
        with:
          name: plan-test-workspace-01
          path: plans/test-workspace-01
        continue-on-error: true

      - name: Post combined comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const workspaces = ['terraform_cloud', 'test-workspace-01'];

            function readFile(filePath) {
              try { return fs.readFileSync(filePath, 'utf8'); }
              catch { return null; }
            }

            function parseOutcomes(content) {
              const result = { fmt: 'unknown', validate: 'unknown', plan: 'unknown' };
              if (!content) return result;
              for (const line of content.trim().split('\n')) {
                const [key, val] = line.split('=');
                if (key && val) result[key.trim()] = val.trim();
              }
              return result;
            }

            const maxLength = 25000; // per workspace, to stay under GH limit
            const statusIcon = (o) => o === 'success' ? '✅' : o === 'failure' ? '❌' : '⚠️';

            let body = `## 🏗️ Terraform Plan Results\n`;
            body += `> Commit: \`${{ github.event.pull_request.head.sha }}\` | Triggered by @${{ github.actor }}\n\n`;

            for (const ws of workspaces) {
              const planRaw  = readFile(`plans/${ws}/plan_output.txt`);
              const outcomes = parseOutcomes(readFile(`plans/${ws}/outcomes.txt`));
              const plan     = planRaw
                ? (planRaw.length > maxLength ? '...(truncated)\n' + planRaw.slice(-maxLength) : planRaw)
                : '_Plan output not available_';

              body += `---\n`;
              body += `### 🗂️ Workspace: \`${ws}\`\n\n`;
              body += `| Step | Result |\n|------|--------|\n`;
              body += `| Format (fmt) | ${statusIcon(outcomes.fmt)} \`${outcomes.fmt}\` |\n`;
              body += `| Validate     | ${statusIcon(outcomes.validate)} \`${outcomes.validate}\` |\n`;
              body += `| Plan         | ${statusIcon(outcomes.plan)} \`${outcomes.plan}\` |\n\n`;
              body += `<details>\n<summary>📋 Show Plan Output — ${ws}</summary>\n\n`;
              body += `\`\`\`\n${plan}\n\`\`\`\n</details>\n\n`;
            }

            body += `---\n> ⚠️ Review all plans carefully before merging.`;

            // Update existing bot comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🏗️ Terraform Plan Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if any plan failed
        if: needs.terraform-plan.result == 'failure'
        run: exit 1
